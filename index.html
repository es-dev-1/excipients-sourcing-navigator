<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excipient Sourcing Navigator | Pharma Excipients</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue: #2B6099;
      --blue-hover: #1E4A75;
      /* A subtle fade across the brand blue, about 8% either side of it, used on
         the landing CTA (stage 1), the route cards (stage 2), and the excipient
         buttons (stage 4). Runs top to bottom, so the bands of colour lie
         horizontally: lighter along the top edge, deeper along the bottom. Kept
         narrow on purpose, enough to give the fill some depth without reading as
         a second colour. */
      --blue-fade: linear-gradient(180deg, #336DA9 0%, #2B6099 52%, #245483 100%);
      --blue-fade-hover: linear-gradient(180deg, #285E8F 0%, #1E4A75 52%, #17395B 100%);
      /* The same treatment for the other button colours, each staying within its
         own family: white buttons (stages 3, 5, 6), the pale blue they turn on
         hover, and the sky-blue link pills. These are deliberately shallower
         than the brand-blue fade, because the same drop looks like dirt on a
         near-white fill. */
      --white-fade: linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 55%, #F3F7FB 100%);
      --blue-light-fade: linear-gradient(180deg, #F5F9FD 0%, #EEF3F8 52%, #E3ECF5 100%);
      --sky-fade: linear-gradient(180deg, #D9F1FF 0%, #CDEBFF 52%, #BEE3FA 100%);
      --blue-light: #EEF3F8;
      --blue-glow: rgba(43, 96, 153, 0.25);
      --gray-brand: #4A4F54;
      --gray-brand-hover: #3A3E42;
      --dark: #1A2332;
      --text: #384250;
      --text-light: #6B7785;
      --text-muted: #94A0AE;
      --border: #D5DCE4;
      --bg: #F7F9FB;
      --white: #FFFFFF;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      background-image: radial-gradient(circle, #D5DCE4 0.5px, transparent 0.5px);
      background-size: 28px 28px;
    }

    /* ── Header ── */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 920px;
      margin: 0 auto;
      padding: 0 28px;
      height: 68px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo {
      height: 34px;
      width: auto;
      flex-shrink: 0;
    }

    .header-divider {
      width: 1px;
      height: 28px;
      background: var(--border);
      flex-shrink: 0;
    }

    .header-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: -0.02em;
    }

    /* Sits to the right of the tool name. The header is sticky and lives
       outside #app, so this stays on screen through every stage. */
    .navigator-mark {
      height: 48px;
      width: auto;
      flex-shrink: 0;
    }

    /* ── Breadcrumb ── */
    .breadcrumb {
      max-width: 920px;
      margin: 0 auto;
      padding: 18px 28px 0;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 13.5px;
      min-height: 20px;
    }

    .breadcrumb:empty { display: none; }

    .crumb {
      padding: 2px 0;
      transition: color 0.15s ease;
    }

    .crumb.clickable {
      color: var(--blue);
      cursor: pointer;
    }

    .crumb.clickable:hover {
      color: var(--blue-hover);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .crumb.current {
      color: var(--dark);
      font-weight: 500;
    }

    .sep {
      color: var(--text-muted);
      font-size: 11px;
      user-select: none;
    }

    /* ── Search ── */
    .searchbar {
      max-width: 920px;
      margin: 0 auto;
      padding: 16px 28px 0;
      display: flex;
      justify-content: center;
    }

    .searchbar[hidden] { display: none; }

    /* On the landing page the breadcrumb is empty and hidden, so the search bar
       would otherwise sit right under the header. Give it room to breathe there
       without changing the breadcrumb-to-search gap on stages 2 to 6. */
    .breadcrumb:empty + .searchbar { padding-top: 40px; }

    .search-shell {
      position: relative;
      width: 100%;
      max-width: 560px;
    }

    .search-field {
      display: flex;
      align-items: center;
      gap: 9px;
      height: 42px;
      padding: 0 11px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .search-field:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-glow);
    }

    .search-field > svg {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: none;
      font-family: 'Outfit', sans-serif;
      font-size: 14.5px;
      color: var(--dark);
    }

    .search-input::placeholder { color: var(--text-muted); }

    .search-clear {
      flex-shrink: 0;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-muted);
      font-family: 'Outfit', sans-serif;
      font-size: 19px;
      line-height: 1;
      padding: 2px 5px;
      border-radius: 4px;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .search-clear[hidden] { display: none; }

    .search-clear:hover {
      color: var(--text);
      background: var(--blue-light);
    }

    /* Sits above the page but below the sticky header, which it never overlaps. */
    .search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 90;
      padding: 4px;
      max-height: 348px;
      overflow-y: auto;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
    }

    .search-results[hidden] { display: none; }

    .search-option {
      display: block;
      width: 100%;
      padding: 9px 11px;
      border: none;
      border-radius: 6px;
      background: none;
      text-align: left;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      transition: background 0.12s ease;
    }

    .search-option:hover,
    .search-option.active { background: var(--blue-light-fade); }

    .search-path {
      display: block;
      font-size: 14px;
      line-height: 1.35;
      color: var(--text-light);
    }

    /* The node itself, always last in the path and never followed by anything
       from a deeper stage. */
    .search-path .leaf {
      color: var(--dark);
      font-weight: 600;
    }

    .search-path .step-sep {
      color: var(--text-muted);
      font-size: 13px;
      padding: 0 6px;
    }

    .search-path mark {
      background: rgba(43, 96, 153, 0.15);
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }

    .search-meta {
      display: block;
      margin-top: 2px;
      font-size: 11.5px;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }

    .search-note {
      padding: 12px 11px;
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
    }

    /* ── Main ── */
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 28px 60px;
      overflow: hidden;
    }

    /* ── Welcome ── */
    /* Small top padding: the search bar sits directly above this on the landing
       page, and the two read as one block rather than two stacked ones. */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 12px 20px 60px;
    }

    .welcome h2 {
      font-size: 32px;
      font-weight: 700;
      color: var(--dark);
      letter-spacing: -0.03em;
      margin-bottom: 14px;
      line-height: 1.2;
    }

    .welcome p {
      font-size: 16px;
      color: var(--text-light);
      max-width: 440px;
      margin-bottom: 36px;
      line-height: 1.6;
    }

    .cta-btn {
      background: var(--blue-fade);
      color: var(--white);
      border: none;
      border-radius: 8px;
      padding: 16px 44px;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px var(--blue-glow);
      letter-spacing: 0.01em;
    }

    .cta-btn:hover {
      background: var(--blue-fade-hover);
      box-shadow: 0 6px 24px rgba(43, 96, 153, 0.35);
      transform: translateY(-2px);
    }

    .cta-btn:active {
      transform: translateY(0);
    }

    .stats {
      margin-top: 40px;
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    /* ── Stage Header ── */
    .stage-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
    }

    .stage-header h2 {
      font-size: 22px;
      font-weight: 600;
      color: var(--dark);
      letter-spacing: -0.02em;
    }

    .item-count {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
      white-space: nowrap;
    }

    /* ── Supplier Context ── */
    .supplier-context {
      font-size: 14.5px;
      color: var(--text-light);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .supplier-context strong {
      color: var(--dark);
      font-weight: 600;
    }

    /* ── Button Grid ── */
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .btn-grid.single-col {
      grid-template-columns: 1fr;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Route Cards (Stage 2) ── */
    .route-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .route-card {
      position: relative;
      display: block;
      width: 100%;
      min-height: 128px;
      padding: 0;
      border: 1px solid var(--blue);
      border-radius: 8px;
      background: var(--blue-fade);
      overflow: hidden;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      text-align: left;
      box-shadow: var(--shadow-sm);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    /* The photo. Backdrops are keyed out, so the card's blue shows through. */
    .route-card .route-media {
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
      background-position: right center;
      background-size: auto 118%;
      transition: transform 0.45s cubic-bezier(0.22, 0.8, 0.3, 1);
    }

    /* Slightly transparent blue over the photo: near-solid where the label
       sits, opening up towards the image so the subject stays readable. The
       alpha stops are tuned for legibility and unchanged; the blue itself now
       fades from lighter to deeper across the same axis. */
    .route-card .route-veil {
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg,
        rgba(51, 109, 169, 0.98) 0%,
        rgba(43, 96, 153, 0.95) 40%,
        rgba(38, 87, 137, 0.66) 72%,
        rgba(36, 84, 131, 0.36) 100%);
      transition: opacity 0.25s ease;
    }

    /* Keep the label in the near-solid left band so it never fights the photo. */
    .route-card .route-body {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 18px 20px;
      max-width: 76%;
    }

    .route-card .route-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--white);
      letter-spacing: -0.01em;
      line-height: 1.25;
      text-shadow: 0 1px 3px rgba(15, 35, 60, 0.35);
    }

    .route-card .route-meta {
      font-size: 12.5px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.78);
      text-shadow: 0 1px 3px rgba(15, 35, 60, 0.35);
    }

    .route-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px var(--blue-glow);
    }

    .route-card:hover .route-media { transform: scale(1.05); }
    .route-card:hover .route-veil { opacity: 0.88; }
    .route-card:active { transform: translateY(0); }

    /* The lead route gets a full-width card, leaving the other six as two rows
       of three. Routes are ordered by relevance, not alphabetically, so this is
       always the most relevant one. */
    .route-card.hero {
      grid-column: 1 / -1;
      min-height: 158px;
    }

    .route-card.hero .route-media { background-size: auto 132%; }
    .route-card.hero .route-body { padding: 22px 26px; max-width: 58%; }
    .route-card.hero .route-name { font-size: 21px; letter-spacing: -0.02em; }
    .route-card.hero .route-meta { font-size: 13.5px; }

    /* ── Excipient Buttons (blue variant) ── */
    .nav-btn.blue {
      background: var(--blue-fade);
      border-color: var(--blue);
      border-left-color: var(--blue);
      color: var(--white);
    }

    .nav-btn.blue .btn-label {
      color: var(--white);
    }

    .nav-btn.blue .btn-meta {
      color: rgba(255,255,255,0.6);
    }

    .nav-btn.blue:hover {
      background: var(--blue-fade-hover);
      border-color: var(--blue-hover);
      border-left-color: var(--white);
    }

    /* ── Navigation Buttons ── */
    .nav-btn {
      background: var(--white-fade);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 18px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Outfit', sans-serif;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: var(--shadow-sm);
    }

    .nav-btn:hover {
      border-color: var(--blue);
      background: var(--blue-light-fade);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .nav-btn:active {
      transform: translateY(0);
      box-shadow: var(--shadow-sm);
    }

    .btn-label {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--dark);
      line-height: 1.35;
    }

    .btn-meta {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* ── Supplier Grid ── */
    .supplier-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      max-width: 580px;
      overflow: hidden;
    }

    /* ── Supplier Row ── */
    .supplier-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }

    .supplier-row-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--dark);
      padding: 0 2px;
    }

    .supplier-row-btns {
      display: flex;
      gap: 8px;
    }

    .supplier-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 6px;
      padding: 12px 18px;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      border: 1px solid;
    }

    .supplier-btn-page {
      background: var(--sky-fade);
      border-color: #B0DEFF;
      color: var(--dark);
    }

    .supplier-btn-page:hover {
      background: var(--blue-fade);
      border-color: var(--blue);
      color: var(--white);
      box-shadow: 0 4px 14px var(--blue-glow);
      transform: translateY(-1px);
    }

    .supplier-btn-products {
      background: var(--white-fade);
      border-color: var(--border);
      color: var(--dark);
      flex: 1;
      justify-content: space-between;
      min-width: 0;
      overflow: hidden;
    }

    .supplier-btn-products span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .supplier-btn-products:hover {
      border-color: var(--blue);
      background: var(--blue-light-fade);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .supplier-arrow {
      flex-shrink: 0;
      opacity: 0.5;
      transition: opacity 0.2s ease;
    }

    .supplier-btn:hover .supplier-arrow {
      opacity: 1;
    }

    /* ── Product Grid (Stage 6) ── */
    .product-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      max-width: 580px;
    }

    .product-card {
      display: block;
      background: var(--white-fade);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 18px;
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
    }

    a.product-card:hover {
      border-color: var(--blue);
      background: var(--blue-light-fade);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .product-name {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--dark);
      margin-bottom: 4px;
    }

    .product-chemical {
      font-size: 12.5px;
      color: var(--text-light);
      margin-bottom: 2px;
      overflow-wrap: anywhere;
    }

    .product-function {
      font-size: 12px;
      color: var(--text-muted);
      overflow-wrap: anywhere;
    }

    .tag-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-light);
      background: var(--blue-light);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 7px;
      margin-left: 6px;
      white-space: nowrap;
      vertical-align: 1px;
    }

    .tag-badge.minor {
      background: var(--bg);
      color: var(--text-muted);
    }

    /* ── Shop links for grouped product variants ── */
    .product-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .shop-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 500;
      color: var(--dark);
      background: var(--sky-fade);
      border: 1px solid #B0DEFF;
      border-radius: 5px;
      padding: 5px 10px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .shop-chip:hover {
      background: var(--blue-fade);
      border-color: var(--blue);
      color: var(--white);
    }

    /* ── Stage 6 group divider ── */
    .group-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-muted);
      margin: 4px 0 2px;
    }

    .group-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .group-label.secondary {
      margin-top: 18px;
    }

    .no-products {
      padding: 32px 20px;
      text-align: center;
      color: var(--text-light);
      font-size: 14.5px;
    }

    .unavailable-note {
      padding: 28px 24px;
      text-align: center;
      background: var(--blue-light-fade);
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--text-light);
      font-size: 15px;
      line-height: 1.5;
    }
    .unavailable-note strong { color: var(--text); }

    @media (max-width: 480px) {
      .supplier-row-btns {
        flex-direction: column;
      }
    }

    /* ── Loading ── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 20px;
      color: var(--text-muted);
      font-size: 15px;
      gap: 16px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Animations ── */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in {
      animation: fadeInUp 0.32s ease forwards;
      opacity: 0;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 20px 28px 32px;
      max-width: 920px;
      margin: 0 auto;
    }

    footer a {
      color: var(--text-muted);
      font-size: 12.5px;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    footer a:hover {
      color: var(--blue);
    }

    /* ── Responsive ── */
    @media (max-width: 720px) {
      .btn-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .route-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .route-card { min-height: 116px; }
      .route-card.hero { min-height: 150px; }
      .route-card.hero .route-name { font-size: 19px; }
      .supplier-grid {
        grid-template-columns: 1fr;
      }
      .welcome { padding: 8px 16px 40px; }
      .welcome h2 { font-size: 26px; }
      .header-title { font-size: 15px; }
    }

    @media (max-width: 480px) {
      .btn-grid {
        grid-template-columns: 1fr;
      }
      .route-grid {
        grid-template-columns: 1fr;
      }
      .route-card, .route-card.hero { min-height: 122px; }
      .route-card .route-media, .route-card.hero .route-media { background-size: auto 112%; }
      .route-card.hero .route-body { padding: 18px 20px; }
      .route-card.hero .route-name { font-size: 17px; }
      .header-inner { padding: 0 16px; gap: 12px; }
      main { padding: 20px 16px 48px; }
      .breadcrumb { padding: 14px 16px 0; }
      .searchbar { padding: 12px 16px 0; }
      .breadcrumb:empty + .searchbar { padding-top: 28px; }
      .search-results { max-height: 300px; }
      .welcome h2 { font-size: 23px; }
      .welcome p { font-size: 15px; }
      .stage-header h2 { font-size: 19px; }
      .logo { height: 28px; }
      /* Sized by width, not height: the mark is ~1.94:1, and anything wider
         than about 56px pushes "Excipient Sourcing Navigator" from two wrapped
         lines to three, which overflows the fixed 68px header. */
      .navigator-mark { height: 28px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <img src="pe-logo.png" alt="Pharma Excipients" class="logo">
      <div class="header-divider"></div>
      <span class="header-title">Excipient Sourcing Navigator</span>
      <img src="assets/navigator-mark.webp" alt="" aria-hidden="true" class="navigator-mark">
    </div>
  </header>

  <nav id="breadcrumb" class="breadcrumb"></nav>

  <!-- Skip forward to a route, category, or excipient. Sits between the
       breadcrumb and the stage title, and lives outside #app so it survives
       every stage render and stays in one place. Hidden until data loads. -->
  <div class="searchbar" id="searchbar" hidden>
    <div class="search-shell" id="search-shell">
      <div class="search-field">
        <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="7.75" cy="7.75" r="5.5"/><path d="M11.9 11.9L16 16"/>
        </svg>
        <input id="search-input" class="search-input" type="text"
               placeholder="Jump to route of administration, functional category, or excipient"
               autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="false" aria-autocomplete="list"
               aria-controls="search-results" aria-label="Search the navigator">
        <button type="button" id="search-clear" class="search-clear" aria-label="Clear search" hidden>&times;</button>
      </div>
      <div id="search-results" class="search-results" role="listbox" aria-label="Search results" hidden></div>
    </div>
  </div>

  <main id="app">
    <div class="loading">
      <div class="spinner"></div>
      Loading excipient data...
    </div>
  </main>

  <footer>
    <a href="https://www.pharmaexcipients.com" target="_blank" rel="noopener noreferrer">
      pharmaexcipients.com
    </a>
  </footer>

<script>
// Supplier page URLs now live on each supplier in excipients.json (link field),
// generated from data-for-reoccurring-tasks/supplier-page-urls.md by build-data.py.
// This map is kept only as an optional override and is intentionally empty.
const SUPPLIER_URLS = {};

const ARROW_SVG = '<svg class="supplier-arrow" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13L13 5M13 5H6.5M13 5V11.5"/></svg>';

const state = {
  started: false,
  data: null,
  products: null,
  route: null,
  category: null,
  excipient: null,
  supplier: null
};

function getStage() {
  if (!state.started) return 0;
  if (!state.route) return 1;
  if (!state.category) return 2;
  if (!state.excipient) return 3;
  if (!state.supplier) return 4;
  return 5;
}

function getSupplierUrl(supplier) {
  return SUPPLIER_URLS[supplier.name] || supplier.link || null;
}

function plural(n, singular, pluralForm) {
  return n === 1 ? singular : (pluralForm || singular + 's');
}

// Chemical and function strings are long free text straight from the source
// file, so escape anything going into innerHTML.
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Thousands separator, so the product count reads 2,382 rather than 2382.
function thousands(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function computeStats() {
  let routes = 0, categories = 0;
  // An excipient appears under several routes, so count distinct names.
  const excipients = new Set();
  const suppliers = new Set();
  state.data.forEach(function(r) {
    routes++;
    (r.children || []).forEach(function(c) {
      categories++;
      (c.children || []).forEach(function(e) {
        excipients.add(e.name);
        (e.suppliers || []).forEach(function(s) { suppliers.add(s.name); });
      });
    });
  });

  // A co-processed product is filed under every excipient it contains, so the
  // 3185 listings in products.json are only 2382 actual products. Count
  // distinct product-and-supplier pairs: the same name from two suppliers is
  // two products, the same product under three excipients is still one.
  const products = new Set();
  if (state.products) {
    Object.keys(state.products).forEach(function(exc) {
      var bySupplier = state.products[exc];
      Object.keys(bySupplier).forEach(function(sup) {
        bySupplier[sup].forEach(function(p) { products.add(p.product + '␀' + sup); });
      });
    });
  }

  return { routes: routes, categories: categories, excipients: excipients.size,
           suppliers: suppliers.size, products: products.size };
}

function startExploring() {
  state.started = true;
  render();
}

function selectRoute(route) {
  state.route = route;
  state.category = null;
  state.excipient = null;
  render();
}

function selectCategory(category) {
  state.category = category;
  state.excipient = null;
  render();
}

function selectExcipient(excipient) {
  state.excipient = excipient;
  state.supplier = null;
  render();
}

function selectSupplier(supplier) {
  state.supplier = supplier;
  render();
}

function goBack(toStage) {
  if (toStage <= 1) { state.route = null; state.category = null; state.excipient = null; state.supplier = null; }
  else if (toStage <= 2) { state.category = null; state.excipient = null; state.supplier = null; }
  else if (toStage <= 3) { state.excipient = null; state.supplier = null; }
  else if (toStage <= 4) { state.supplier = null; }
  if (toStage === 0) { state.started = false; }
  render();
}

// Products are filed under excipient > supplier in products.json, so stage 6 is
// a direct lookup. No keyword guessing: every product shown is one the source
// tree explicitly lists for this excipient.
function getProducts(excipientName, supplierName) {
  if (!state.products) return [];
  var bySupplier = state.products[excipientName];
  if (!bySupplier || !bySupplier[supplierName]) return [];
  return bySupplier[supplierName];
}

function renderBreadcrumb() {
  var bc = document.getElementById('breadcrumb');
  var stage = getStage();

  if (stage === 0) { bc.innerHTML = ''; return; }

  // Home is the landing screen and is always one click away from stages 2 to 6.
  // The route list is its own crumb after it, so no single label stands for two
  // different screens.
  var html = '<span class="crumb clickable" onclick="goBack(0)">Home</span>';

  html += '<span class="sep">/</span>';
  html += stage > 1
    ? '<span class="crumb clickable" onclick="goBack(1)">Routes</span>'
    : '<span class="crumb current">Routes</span>';

  if (stage >= 2 && state.route) {
    var rn = state.route.name.replace(' Excipients', '');
    html += '<span class="sep">/</span>';
    html += stage > 2
      ? '<span class="crumb clickable" onclick="goBack(2)">' + esc(rn) + '</span>'
      : '<span class="crumb current">' + esc(rn) + '</span>';
  }

  if (stage >= 3 && state.category) {
    html += '<span class="sep">/</span>';
    html += stage > 3
      ? '<span class="crumb clickable" onclick="goBack(3)">' + esc(state.category.name) + '</span>'
      : '<span class="crumb current">' + esc(state.category.name) + '</span>';
  }

  if (stage >= 4 && state.excipient) {
    html += '<span class="sep">/</span>';
    html += stage > 4
      ? '<span class="crumb clickable" onclick="goBack(4)">' + esc(state.excipient.name) + '</span>'
      : '<span class="crumb current">' + esc(state.excipient.name) + '</span>';
  }

  if (stage >= 5 && state.supplier) {
    html += '<span class="sep">/</span>';
    html += '<span class="crumb current">' + esc(state.supplier.name) + '</span>';
  }

  bc.innerHTML = html;
}

function render() {
  var app = document.getElementById('app');
  var stage = getStage();

  switch (stage) {
    case 0: renderWelcome(app); break;
    case 1: renderRoutes(app); break;
    case 2: renderCategories(app); break;
    case 3: renderExcipients(app); break;
    case 4: renderSuppliers(app); break;
    case 5: renderProducts(app); break;
  }

  renderBreadcrumb();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderWelcome(container) {
  var s = state.data ? computeStats() : null;
  var statsHtml = s
    ? '<div class="stats">' + thousands(s.routes) + ' routes &middot; ' +
        thousands(s.categories) + ' categories &middot; ' +
        thousands(s.excipients) + ' excipients &middot; ' +
        thousands(s.suppliers) + ' suppliers &middot; ' +
        thousands(s.products) + ' products</div>'
    : '';

  container.innerHTML =
    '<div class="welcome animate-in">' +
      '<h2>Find Your Excipient Products</h2>' +
      '<p>Navigate by route of administration and category to find the right excipient products on PharmaExcipients.com</p>' +
      '<button class="cta-btn" onclick="startExploring()">Start Exploring</button>' +
      statsHtml +
    '</div>';
}

// Route photo files in assets/routes/, keyed to transparent backgrounds by
// build-route-images.py. A route with no image just renders as a plain blue card.
const ROUTE_IMAGES = {
  'Oral Excipients': 'oral',
  'Injectable Excipients': 'injectable',
  'Inhalation / Pulmonary Excipients': 'inhalation-pulmonary',
  'Nasal Excipients': 'nasal',
  'Topical Excipients': 'topical',
  'Ocular Excipients': 'ocular',
  'Rectal & Vaginal Excipients': 'rectal-vaginal'
};

function renderRoutes(container) {
  var items = state.data;
  container.innerHTML =
    '<div class="stage-header animate-in">' +
      '<h2>Select Route of Administration</h2>' +
      '<span class="item-count">' + items.length + ' routes</span>' +
    '</div>' +
    '<div class="route-grid" id="route-grid"></div>';

  var grid = document.getElementById('route-grid');
  items.forEach(function(route, i) {
    var btn = document.createElement('button');
    // Routes come from the data in relevance order, not alphabetically, so the
    // first one is the most relevant and takes the full-width card. The other
    // six then fall into two clean rows of three.
    btn.className = 'route-card animate-in' + (i === 0 ? ' hero' : '');
    btn.style.animationDelay = (i + 1) * 55 + 'ms';
    btn.setAttribute('aria-label', route.name);

    var n = route.children ? route.children.length : 0;
    var slug = ROUTE_IMAGES[route.name];
    var media = slug
      ? '<span class="route-media" style="background-image:url(&quot;assets/routes/' + slug + '.webp&quot;)"></span>'
      : '';

    btn.innerHTML =
      media +
      '<span class="route-veil"></span>' +
      '<span class="route-body">' +
        '<span class="route-name">' + esc(route.name) + '</span>' +
        '<span class="route-meta">' + n + ' ' + plural(n, 'category', 'categories') + '</span>' +
      '</span>';
    btn.onclick = function() { selectRoute(route); };
    grid.appendChild(btn);
  });
}

function renderCategories(container) {
  var items = state.route.children || [];
  container.innerHTML =
    '<div class="stage-header animate-in">' +
      '<h2>Select Excipient Category</h2>' +
      '<span class="item-count">' + items.length + ' ' + plural(items.length, 'category', 'categories') + '</span>' +
    '</div>' +
    '<div class="btn-grid" id="btn-grid"></div>';

  var grid = document.getElementById('btn-grid');
  items.forEach(function(cat, i) {
    var btn = document.createElement('button');
    btn.className = 'nav-btn animate-in';
    btn.style.animationDelay = (i + 1) * 35 + 'ms';
    var n = cat.children ? cat.children.length : 0;
    btn.innerHTML =
      '<span class="btn-label">' + esc(cat.name) + '</span>' +
      '<span class="btn-meta">' + n + ' ' + plural(n, 'excipient') + '</span>';
    btn.onclick = function() { selectCategory(cat); };
    grid.appendChild(btn);
  });
}

function renderExcipients(container) {
  var items = state.category.children || [];
  container.innerHTML =
    '<div class="stage-header animate-in">' +
      '<h2>Select Excipient</h2>' +
      '<span class="item-count">' + items.length + ' ' + plural(items.length, 'excipient') + '</span>' +
    '</div>' +
    '<div class="btn-grid" id="btn-grid"></div>';

  var grid = document.getElementById('btn-grid');
  items.forEach(function(exc, i) {
    var btn = document.createElement('button');
    btn.className = 'nav-btn blue animate-in';
    btn.style.animationDelay = (i + 1) * 35 + 'ms';
    var n = exc.suppliers ? exc.suppliers.length : 0;
    var meta = n > 0 ? (n + ' ' + plural(n, 'supplier')) : 'Currently unavailable';
    btn.innerHTML =
      '<span class="btn-label">' + esc(exc.name) + '</span>' +
      '<span class="btn-meta">' + meta + '</span>';
    btn.onclick = function() { selectExcipient(exc); };
    grid.appendChild(btn);
  });
}

function renderSuppliers(container) {
  // Already alphabetical: build-data.py sorts every list the tool renders.
  var suppliers = state.excipient.suppliers || [];
  var routeName = state.route.name.replace(' Excipients', '');
  var excName = state.excipient.name;

  if (suppliers.length === 0) {
    container.innerHTML =
      '<div class="stage-header animate-in">' +
        '<h2>Available Suppliers</h2>' +
        '<span class="item-count">0 suppliers</span>' +
      '</div>' +
      '<div class="unavailable-note animate-in" style="animation-delay:50ms">' +
        '<strong>' + esc(excName) + '</strong> is currently unavailable on PharmaExcipients.com.<br>' +
        'No supplier currently lists this excipient on the portal.' +
      '</div>';
    return;
  }

  container.innerHTML =
    '<div class="stage-header animate-in">' +
      '<h2>Available Suppliers</h2>' +
      '<span class="item-count">' + suppliers.length + ' ' + plural(suppliers.length, 'supplier') + '</span>' +
    '</div>' +
    '<p class="supplier-context animate-in" style="animation-delay:50ms">' +
      'Suppliers of <strong>' + esc(excName) + '</strong> for <strong>' + esc(routeName) + '</strong> formulations' +
    '</p>' +
    '<div class="supplier-grid" id="supplier-grid"></div>';

  var grid = document.getElementById('supplier-grid');
  suppliers.forEach(function(sup, i) {
    var url = getSupplierUrl(sup);
    var row = document.createElement('div');
    row.className = 'supplier-row animate-in';
    row.style.animationDelay = (i + 1) * 60 + 'ms';

    var nameEl = document.createElement('div');
    nameEl.className = 'supplier-row-name';
    nameEl.textContent = sup.name;
    row.appendChild(nameEl);

    var btns = document.createElement('div');
    btns.className = 'supplier-row-btns';

    if (url) {
      var pageBtn = document.createElement('a');
      pageBtn.className = 'supplier-btn supplier-btn-page';
      pageBtn.href = url;
      pageBtn.target = '_blank';
      pageBtn.rel = 'noopener noreferrer';
      pageBtn.innerHTML = 'Supplier Page ' + ARROW_SVG;
      btns.appendChild(pageBtn);
    }

    var prodBtn = document.createElement('button');
    prodBtn.className = 'supplier-btn supplier-btn-products';
    prodBtn.innerHTML = '<span>' + esc(excName) + ' by ' + esc(sup.name) + '</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>';
    prodBtn.onclick = (function(s) { return function() { selectSupplier(s); }; })(sup);
    btns.appendChild(prodBtn);

    row.appendChild(btns);
    grid.appendChild(row);
  });
}

function buildProductCard(p, delay) {
  var links = p.links || [];
  var single = links.length === 1 ? links[0] : null;
  var card;

  // One shop page: the whole card is the link. Several (grouped grade variants):
  // the card stays static and each variant gets its own chip.
  if (single) {
    card = document.createElement('a');
    card.href = single.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
  } else {
    card = document.createElement('div');
  }
  card.className = 'product-card animate-in';
  card.style.animationDelay = delay + 'ms';

  var badgeClass = p.primary ? 'tag-badge' : 'tag-badge minor';
  var html =
    '<div class="product-name">' + esc(p.product) + (single ? ' ' + ARROW_SVG : '') + '</div>' +
    '<div class="product-chemical">' + esc(p.chemical) +
      '<span class="' + badgeClass + '">' + esc(p.tagLabel) + '</span></div>' +
    '<div class="product-function">' + esc(p.function) + '</div>';

  if (links.length > 1) {
    html += '<div class="product-links">' + links.map(function(l) {
      return '<a class="shop-chip" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' +
        esc(l.label) + ARROW_SVG + '</a>';
    }).join('') + '</div>';
  }

  card.innerHTML = html;
  return card;
}

function renderProducts(container) {
  var supplierName = state.supplier.name;
  var excName = state.excipient.name;
  var products = getProducts(excName, supplierName);
  var primary = products.filter(function(p) { return p.primary; });
  var secondary = products.filter(function(p) { return !p.primary; });

  container.innerHTML =
    '<div class="stage-header animate-in">' +
      '<h2>' + esc(excName) + ' by ' + esc(supplierName) + '</h2>' +
      '<span class="item-count">' + products.length + ' ' + plural(products.length, 'product') + '</span>' +
    '</div>' +
    '<div class="product-grid" id="product-grid"></div>';

  var grid = document.getElementById('product-grid');

  if (products.length === 0) {
    grid.innerHTML = '<div class="no-products animate-in">No specific products found for this combination.</div>';
    return;
  }

  var i = 0;
  function addGroup(items, label, cls) {
    if (!items.length) return;
    if (label) {
      var head = document.createElement('div');
      head.className = 'group-label animate-in ' + cls;
      head.style.animationDelay = (i + 1) * 40 + 'ms';
      head.textContent = label;
      grid.appendChild(head);
    }
    items.forEach(function(p) {
      grid.appendChild(buildProductCard(p, ++i * 40));
    });
  }

  // Products built on the excipient first; ones where it is only a minor or
  // derived component after, so the most relevant results stay on top.
  var split = primary.length > 0 && secondary.length > 0;
  addGroup(primary, split ? 'Based on ' + excName : null, 'primary');
  addGroup(secondary, split ? excName + ' as a minor or derived component'
                            : 'Contains ' + excName, 'secondary');
}

// ── Search ────────────────────────────────────────────────────────────────
// Every route, every functional category, and every excipient is its own
// searchable node, so an excipient filed under two categories is two separate
// hits that jump to two different places, and a category that repeats across
// routes is one hit per route. A node never reaches past its own stage: a
// category node names its route and itself, never the excipients inside it.
//
// Picking a hit is the same as having clicked through to it by hand. From
// there the user browses on manually, so nothing else about the flow changes.

const TYPE_ORDER = { Route: 0, Category: 1, Excipient: 2 };
const MIN_QUERY = 2;
const MAX_RESULTS = 24;

const searchUI = { index: [], results: [], active: -1, query: '' };

// The full placeholder needs about 416px. The field has ~510px at 980px wide
// but only ~308px on a phone, where the text would cut off mid-word, so a short
// version takes over below 560px. The HTML carries the full text, which is what
// shows if this never runs.
const PLACEHOLDER_FULL = 'Jump to route of administration, functional category, or excipient';
const PLACEHOLDER_SHORT = 'Jump to a route, category, or excipient';

function fitPlaceholder() {
  document.getElementById('search-input').placeholder =
    window.innerWidth < 560 ? PLACEHOLDER_SHORT : PLACEHOLDER_FULL;
}

// Lower-cased, accent-stripped copy of a string, used for matching. For the
// characters in this data it comes out the same length as the source, which is
// what lets highlight() map match positions back onto the original text.
function fold(s) {
  return String(s == null ? '' : s)
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function buildSearchIndex() {
  var nodes = [];

  function add(node) {
    node.labelFold = fold(node.label);
    nodes.push(node);
  }

  state.data.forEach(function(route, ri) {
    // Same short form the breadcrumb uses. The full name still matches, so
    // "oral excipients" finds the route even though the hit reads "Oral".
    var rn = route.name.replace(' Excipients', '');
    var cats = route.children || [];

    add({
      type: 'Route', label: rn, trail: [], order: [ri, -1, -1],
      meta: cats.length + ' ' + plural(cats.length, 'category', 'categories'),
      hay: fold(rn + ' ' + route.name),
      route: route, category: null, excipient: null
    });

    cats.forEach(function(cat, ci) {
      var excs = cat.children || [];
      add({
        type: 'Category', label: cat.name, trail: [rn], order: [ri, ci, -1],
        meta: excs.length + ' ' + plural(excs.length, 'excipient'),
        hay: fold(cat.name + ' ' + rn),
        route: route, category: cat, excipient: null
      });

      excs.forEach(function(exc, ei) {
        var n = (exc.suppliers || []).length;
        add({
          type: 'Excipient', label: exc.name, trail: [rn, cat.name], order: [ri, ci, ei],
          meta: n ? n + ' ' + plural(n, 'supplier') : 'Currently unavailable',
          hay: fold(exc.name + ' ' + rn + ' ' + cat.name),
          route: route, category: cat, excipient: exc
        });
      });
    });
  });

  return nodes;
}

// 0 the label starts with the query, 1 a word in it does, 2 it appears
// somewhere in the label, 3 only the route or category above it matched.
function labelRank(labelFold, q) {
  var i = labelFold.indexOf(q);
  if (i === -1) return 3;
  if (i === 0) return 0;
  while (i !== -1) {
    if (!/[a-z0-9]/.test(labelFold.charAt(i - 1))) return 1;
    i = labelFold.indexOf(q, i + 1);
  }
  return 2;
}

function searchNodes(query) {
  var q = fold(query).trim().replace(/\s+/g, ' ');
  if (q.length < MIN_QUERY) return [];

  var tokens = q.split(' ');
  var hits = [];

  searchUI.index.forEach(function(node) {
    var matches = tokens.every(function(t) { return node.hay.indexOf(t) !== -1; });
    if (matches) hits.push({ node: node, rank: labelRank(node.labelFold, q) });
  });

  hits.sort(function(a, b) {
    if (a.rank !== b.rank) return a.rank - b.rank;
    var ta = TYPE_ORDER[a.node.type], tb = TYPE_ORDER[b.node.type];
    if (ta !== tb) return ta - tb;
    if (a.node.label.length !== b.node.label.length) return a.node.label.length - b.node.label.length;
    var byLabel = a.node.label.localeCompare(b.node.label);
    if (byLabel !== 0) return byLabel;
    // Same name in several places: fall back to the order the stages use, so
    // the hits read in the same sequence the user would meet them browsing.
    for (var i = 0; i < 3; i++) {
      if (a.node.order[i] !== b.node.order[i]) return a.node.order[i] - b.node.order[i];
    }
    return 0;
  });

  return hits.map(function(h) { return h.node; });
}

// Wrap each occurrence of the query in <mark>. Offsets come from the folded
// copy, so bail out to plain escaped text if folding changed the length and
// those offsets no longer line up with the original.
function highlight(text, q) {
  var lf = fold(text);
  if (!q || lf.length !== text.length) return esc(text);

  var out = '', from = 0, i = lf.indexOf(q);
  while (i !== -1) {
    out += esc(text.slice(from, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>';
    from = i + q.length;
    i = lf.indexOf(q, from);
  }
  return out + esc(text.slice(from));
}

function renderSearchResults() {
  var box = document.getElementById('search-results');
  var input = document.getElementById('search-input');
  var results = searchUI.results;
  var q = searchUI.query;

  box.innerHTML = '';

  if (q.length < MIN_QUERY) {
    box.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
    return;
  }

  if (results.length === 0) {
    box.innerHTML = '<div class="search-note">No route, category, or excipient matches that.</div>';
  }

  results.slice(0, MAX_RESULTS).forEach(function(node, i) {
    var opt = document.createElement('button');
    opt.type = 'button';
    opt.className = 'search-option' + (i === searchUI.active ? ' active' : '');
    opt.id = 'search-option-' + i;
    opt.setAttribute('role', 'option');
    opt.setAttribute('aria-selected', i === searchUI.active ? 'true' : 'false');

    // A chevron, not the breadcrumb's slash: several category names contain a
    // slash of their own ("Starter Cores / Spheres"), which would read as an
    // extra level here.
    var trail = node.trail.map(function(step) {
      return highlight(step, q) + '<span class="step-sep">&rsaquo;</span>';
    }).join('');

    opt.innerHTML =
      '<span class="search-path">' + trail +
        '<span class="leaf">' + highlight(node.label, q) + '</span></span>' +
      '<span class="search-meta">' + esc(node.type) + ' &middot; ' + esc(node.meta) + '</span>';

    // mousedown, not click: the input's blur would close the list first.
    opt.addEventListener('mousedown', function(e) { e.preventDefault(); goToNode(node); });
    box.appendChild(opt);
  });

  if (results.length > MAX_RESULTS) {
    var note = document.createElement('div');
    note.className = 'search-note';
    note.textContent = (results.length - MAX_RESULTS) + ' more matches. Keep typing to narrow it down.';
    box.appendChild(note);
  }

  box.hidden = false;
  input.setAttribute('aria-expanded', 'true');
  if (searchUI.active >= 0) {
    input.setAttribute('aria-activedescendant', 'search-option-' + searchUI.active);
  } else {
    input.removeAttribute('aria-activedescendant');
  }
}

function runSearch() {
  var input = document.getElementById('search-input');
  searchUI.query = fold(input.value).trim().replace(/\s+/g, ' ');
  searchUI.results = searchNodes(input.value);
  searchUI.active = -1;
  document.getElementById('search-clear').hidden = input.value.length === 0;
  renderSearchResults();
}

function moveSearchActive(step) {
  var shown = Math.min(searchUI.results.length, MAX_RESULTS);
  if (shown === 0) return;
  // Slots run 0..shown, where slot 0 is "nothing highlighted" (active -1), so
  // arrowing past either end cycles back through the input rather than sticking.
  var slot = (searchUI.active + 1 + step + shown + 1) % (shown + 1);
  searchUI.active = slot - 1;
  renderSearchResults();
  var el = document.getElementById('search-option-' + searchUI.active);
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function closeSearch(clearInput) {
  var input = document.getElementById('search-input');
  if (clearInput) {
    input.value = '';
    searchUI.query = '';
    document.getElementById('search-clear').hidden = true;
  }
  searchUI.results = [];
  searchUI.active = -1;
  document.getElementById('search-results').hidden = true;
  input.setAttribute('aria-expanded', 'false');
  input.removeAttribute('aria-activedescendant');
}

// Land on the node exactly where clicking through by hand would have landed:
// a route opens its categories, a category opens its excipients, an excipient
// opens its suppliers.
function goToNode(node) {
  state.started = true;
  state.route = node.route;
  state.category = node.category;
  state.excipient = node.excipient;
  state.supplier = null;
  closeSearch(true);
  document.getElementById('search-input').blur();
  render();
}

function initSearch() {
  searchUI.index = buildSearchIndex();

  var bar = document.getElementById('searchbar');
  var shell = document.getElementById('search-shell');
  var input = document.getElementById('search-input');

  fitPlaceholder();
  window.addEventListener('resize', fitPlaceholder);

  input.addEventListener('input', runSearch);
  input.addEventListener('focus', function() { if (input.value) runSearch(); });

  input.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSearchActive(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSearchActive(-1); }
    else if (e.key === 'Enter') {
      var node = searchUI.results[searchUI.active >= 0 ? searchUI.active : 0];
      if (node) { e.preventDefault(); goToNode(node); }
    } else if (e.key === 'Escape') {
      e.preventDefault();
      closeSearch(true);
      input.blur();
    }
  });

  document.getElementById('search-clear').addEventListener('click', function() {
    closeSearch(true);
    input.focus();
  });

  document.addEventListener('click', function(e) {
    if (!shell.contains(e.target)) closeSearch(false);
  });

  // "/" focuses the box, the way it does on most search-first pages.
  document.addEventListener('keydown', function(e) {
    if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    e.preventDefault();
    input.focus();
    input.select();
  });

  bar.hidden = false;
}

// Both files are regenerated by build-data.py whenever the source data changes,
// and they are served with no Cache-Control, so a browser is free to hold on to
// a stale copy and quietly show yesterday's landscape. cache: 'no-cache' forces
// a revalidation on every load: unchanged data comes back as a 304 and costs
// nothing, changed data always arrives.
function loadJSON(file) {
  return fetch(file, { cache: 'no-cache' }).then(function(r) {
    if (!r.ok) throw new Error(file + ': HTTP ' + r.status);
    return r.json();
  });
}

async function init() {
  try {
    var results = await Promise.all([
      loadJSON('excipients.json'),
      loadJSON('products.json')
    ]);
    state.data = results[0];
    state.products = results[1];
    initSearch();
    render();
  } catch (err) {
    document.getElementById('app').innerHTML =
      '<div class="loading" style="color:var(--text)">' +
        '<p>Could not load data.</p>' +
        '<p style="font-size:13px;color:var(--text-muted)">Make sure excipients.json and products.json are in the same folder and serve this page from a web server.</p>' +
      '</div>';
  }
}

init();
</script>

</body>
